<!--
  The Friction mark.

  Nine cells, one hot and one warm beneath it: many reviews, and the one
  complaint that comes back. It is the heat strip on the homepage reduced
  until it still reads at 16px, which is the only size that matters here.

  Colours are the project's tokens converted to sRGB — a favicon is loaded
  outside the document, so it cannot reach the CSS custom properties. They
  are set here rather than inline so the two themes stay legible.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Friction">
  <style>
    .q { fill: #d3ccc7; }
    .warm { fill: #c25500; fill-opacity: 0.42; }
    .hot { fill: #c25500; }

    @media (prefers-color-scheme: dark) {
      .q { fill: #2d2725; }
      .warm { fill: #ff8f31; fill-opacity: 0.45; }
      .hot { fill: #ff8f31; }
    }
  </style>

  <g>
    <rect class="q" x="8" y="8" width="32" height="32" rx="7" />
    <rect class="hot" x="48" y="8" width="32" height="32" rx="7" />
    <rect class="q" x="88" y="8" width="32" height="32" rx="7" />

    <rect class="q" x="8" y="48" width="32" height="32" rx="7" />
    <rect class="warm" x="48" y="48" width="32" height="32" rx="7" />
    <rect class="q" x="88" y="48" width="32" height="32" rx="7" />

    <rect class="q" x="8" y="88" width="32" height="32" rx="7" />
    <rect class="q" x="48" y="88" width="32" height="32" rx="7" />
    <rect class="q" x="88" y="88" width="32" height="32" rx="7" />
  </g>
</svg>
